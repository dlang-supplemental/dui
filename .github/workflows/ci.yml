name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: windows-latest
          - os: windows-11-arm
          - os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout dui
        uses: actions/checkout@v4
        with:
          path: dui
      - name: Checkout dew (matching branch, else main)
        uses: actions/checkout@v4
        with:
          repository: dlang-supplemental/dew
          path: dew
          ref: ${{ github.head_ref || github.ref_name }}
        continue-on-error: true
      - name: Checkout dew main fallback
        if: hashFiles('dew/dub.sdl') == ''
        uses: actions/checkout@v4
        with:
          repository: dlang-supplemental/dew
          path: dew
          ref: main
      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      - run: dub test --compiler=ldc2
        working-directory: dui
      - run: dub build --compiler=ldc2 --build=release
        working-directory: dui/examples/hello
